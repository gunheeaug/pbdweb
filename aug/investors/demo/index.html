<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aug — Demo</title>
    <meta name="description" content="Aug product demos — sticker posting, anime and K-pop fan groups.">
    <meta name="robots" content="noindex">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pbd.team/aug/investors/demo/">
    <meta property="og:title" content="Aug — Demo">
    <meta property="og:description" content="Aug product demos — sticker posting, anime and K-pop fan groups.">
    <meta property="og:image" content="https://pbd.team/assets/images/aug Thumbnail.png">

    <link rel="icon" type="image/png" href="/assets/images/aug-icon.png">
    <link rel="apple-touch-icon" href="/assets/images/aug-icon.png">
    <link href="/assets/fonts/CalSans-Regular.ttf" rel="preload" as="font" type="font/ttf" crossorigin="anonymous">

    <style>
        @font-face {
            font-family: "Cal Sans";
            src: url("/assets/fonts/CalSans-Regular.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --neon: #B0F600;
            --black: #0A0A0A;
            --white: #FFFFFF;
            --muted: #8A8A86;
            --nav-h: 64px;
            --font-display: "Cal Sans", system-ui, sans-serif;
            --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-behavior: smooth; }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .carousel-track,
            .demo-intro {
                transition: none !important;
            }
        }

        body {
            font-family: var(--font-body);
            color: var(--black);
            background: var(--white);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            min-height: 100vh;
            min-height: 100dvh;
        }

        a { color: inherit; text-decoration: none; }
        a:hover { text-decoration: underline; }
        :focus-visible { outline: 2px solid var(--neon); outline-offset: 3px; }

        .skip-link {
            position: absolute;
            left: -999px;
            top: 0;
            background: var(--black);
            color: var(--neon);
            padding: 12px 16px;
            z-index: 1000;
        }
        .skip-link:focus { left: 12px; top: 12px; }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 100;
            height: var(--nav-h);
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .site-nav {
            max-width: 1200px;
            margin: 0 auto;
            height: 100%;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-display);
            font-size: 1.35rem;
            letter-spacing: -0.03em;
            text-decoration: none !important;
            color: var(--black);
        }

        .brand picture { display: contents; }

        .brand-icon {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: block;
            flex-shrink: 0;
        }

        .brand-label {
            display: inline-flex;
            align-items: baseline;
            position: relative;
            top: -2px;
            line-height: 1;
        }

        .brand-section {
            font-size: 1.05rem;
            color: var(--muted);
            letter-spacing: -0.02em;
        }

        .nav-back {
            font-size: 0.8125rem;
            font-weight: 600;
            text-decoration: none !important;
            color: var(--black);
            border-bottom: 2px solid transparent;
        }

        .nav-back:hover {
            border-bottom-color: var(--neon);
            text-decoration: none;
        }

        main {
            max-width: 960px;
            margin: 0 auto;
            padding: calc(var(--nav-h) + 28px) 24px 56px;
            text-align: center;
        }

        .demo-intro {
            margin-bottom: 1.5rem;
            min-height: 7.5rem;
        }

        .demo-kicker {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.55rem;
        }

        h1 {
            font-family: var(--font-display);
            font-size: clamp(2rem, 4vw, 2.85rem);
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 0.55rem;
        }

        .lede {
            font-size: clamp(1rem, 1.5vw, 1.15rem);
            color: #3A3A38;
            max-width: 34rem;
            margin: 0 auto;
            line-height: 1.45;
        }

        .carousel {
            position: relative;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .carousel-viewport {
            overflow: hidden;
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
            touch-action: pan-y;
        }

        .carousel-track {
            display: flex;
            width: 100%;
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
        }

        .carousel-slide {
            flex: 0 0 100%;
            width: 100%;
            min-width: 0;
        }

        .carousel-slide video {
            display: block;
            width: 100%;
            aspect-ratio: 9 / 19.5;
            object-fit: cover;
            border-radius: 24px;
            background: #111;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
            cursor: pointer;
        }

        .carousel-meta {
            margin-top: 1rem;
            min-height: 2.75rem;
        }

        .carousel-meta a {
            display: inline-block;
            font-size: 0.8125rem;
            font-weight: 600;
            color: #007AFF;
            text-decoration: none;
            border-bottom: 1px solid transparent;
        }

        .carousel-meta a:hover {
            border-bottom-color: currentColor;
        }

        .audio-hint {
            font-size: 0.8125rem;
            font-weight: 500;
            color: #007AFF;
            margin-top: 0.35rem;
            cursor: pointer;
        }

        .audio-hint.is-hidden { display: none; }

        .carousel-btn {
            appearance: none;
            border: 0;
            background: transparent;
            color: var(--black);
            width: 48px;
            height: 48px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s ease, opacity 0.2s ease;
        }

        .carousel-btn:hover {
            background: rgba(10, 10, 10, 0.06);
        }

        .carousel-btn:disabled {
            opacity: 0.28;
            cursor: default;
            background: transparent;
        }

        .carousel-btn svg {
            width: 28px;
            height: 28px;
            display: block;
        }

        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 1.25rem;
        }

        .carousel-dot {
            appearance: none;
            border: 0;
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: rgba(10, 10, 10, 0.18);
            cursor: pointer;
            padding: 0;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .carousel-dot[aria-current="true"] {
            background: var(--black);
            transform: scale(1.15);
        }

        .carousel-count {
            margin-top: 0.65rem;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--muted);
            letter-spacing: 0.02em;
        }

        @media (max-width: 899px) {
            .site-nav { padding: 0 20px; }
            main { padding: calc(var(--nav-h) + 20px) 12px 48px; }
            .demo-intro { min-height: 8.25rem; margin-bottom: 1.15rem; }
            .carousel { gap: 0; }
            .carousel-btn { width: 40px; height: 40px; }
            .carousel-btn svg { width: 24px; height: 24px; }
            .carousel-viewport { max-width: 280px; }
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#demos">Skip to demos</a>

    <header class="site-header">
        <nav class="site-nav" aria-label="Demo navigation">
            <a class="brand" href="/aug/investors/">
                <picture>
                    <source srcset="/assets/images/aug-icon.webp" type="image/webp">
                    <img src="/assets/images/aug-icon.png" alt="" class="brand-icon" width="28" height="28" decoding="async">
                </picture>
                <span class="brand-label"><span class="brand-text">aug</span><span class="brand-section">/Investors</span></span>
            </a>
            <a class="nav-back" href="/aug/investors/">← Pitch</a>
        </nav>
    </header>

    <main id="demos">
        <div class="demo-intro" aria-live="polite">
            <p class="demo-kicker" data-kicker>Sticker posting</p>
            <h1 data-heading>Leave stickers in the world</h1>
            <p class="lede" data-lede>Drop AR stickers into the camera scene in seconds — content that lives on the place, not in a feed.</p>
        </div>

        <div class="carousel" data-carousel>
            <button type="button" class="carousel-btn" data-prev aria-label="Previous demo">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M15 5L8 12l7 7" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>

            <div class="carousel-viewport" aria-roledescription="carousel" aria-label="Demo videos">
                <div class="carousel-track" data-track>
                    <article
                        class="carousel-slide"
                        data-href="https://pbd.team/aug/investors/demo/posting1/"
                        data-kicker="Sticker posting"
                        data-heading="Leave stickers in the world"
                        data-lede="Drop AR stickers into the camera scene in seconds — content that lives on the place, not in a feed."
                    >
                        <video
                            src="/assets/videos/aug/demo/sticker-posting-0.mp4"
                            muted
                            loop
                            playsinline
                            preload="metadata"
                            aria-label="General sticker posting demo"
                        ></video>
                    </article>
                    <article
                        class="carousel-slide"
                        data-href="https://pbd.team/aug/investors/demo/anime/"
                        data-kicker="Anime fandom"
                        data-heading="Anime energy, left in place"
                        data-lede="Turn fan hangouts into shared augmented boards — reactions, stickers, and posts tied to the location."
                    >
                        <video
                            src="/assets/videos/aug/demo/anime-fan-group.mp4"
                            muted
                            loop
                            playsinline
                            preload="metadata"
                            aria-label="Anime fan group demo"
                        ></video>
                    </article>
                    <article
                        class="carousel-slide"
                        data-href="https://pbd.team/aug/investors/demo/posting2/"
                        data-kicker="Sticker posting"
                        data-heading="Post what happens here"
                        data-lede="Capture the moment with spatial stickers and share them where they belong — right in the scene."
                    >
                        <video
                            src="/assets/videos/aug/demo/sticker-posting-1.mp4"
                            muted
                            loop
                            playsinline
                            preload="metadata"
                            aria-label="General sticker posting demo 2"
                        ></video>
                    </article>
                    <article
                        class="carousel-slide"
                        data-href="https://pbd.team/aug/investors/demo/kpop/"
                        data-kicker="K-pop fandom"
                        data-heading="Idol fandom, on location"
                        data-lede="Concert venues, pop-ups, and fan spots become persistent boards for messages, stickers, and fan content."
                    >
                        <video
                            src="/assets/videos/aug/demo/kpop-fan-group.mp4"
                            muted
                            loop
                            playsinline
                            preload="metadata"
                            aria-label="K-pop idol fan group post demo"
                        ></video>
                    </article>
                </div>
            </div>

            <button type="button" class="carousel-btn" data-next aria-label="Next demo">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>

        <div class="carousel-meta">
            <a data-permalink href="https://pbd.team/aug/investors/demo/posting1/">Open this demo →</a>
            <p class="audio-hint" data-audio-hint>Tap video for sound</p>
        </div>

        <div class="carousel-dots" data-dots role="tablist" aria-label="Choose demo"></div>
        <p class="carousel-count" data-count aria-live="polite">1 / 4</p>
    </main>

    <script>
        (function () {
            const root = document.querySelector('[data-carousel]');
            const track = root.querySelector('[data-track]');
            const slides = Array.from(track.querySelectorAll('.carousel-slide'));
            const prevBtn = root.querySelector('[data-prev]');
            const nextBtn = root.querySelector('[data-next]');
            const dotsWrap = document.querySelector('[data-dots]');
            const kickerEl = document.querySelector('[data-kicker]');
            const headingEl = document.querySelector('[data-heading]');
            const ledeEl = document.querySelector('[data-lede]');
            const linkEl = document.querySelector('[data-permalink]');
            const countEl = document.querySelector('[data-count]');
            const hintEl = document.querySelector('[data-audio-hint]');
            const videos = slides.map((slide) => slide.querySelector('video'));

            let index = 0;
            let audioUnlocked = false;
            let touchStartX = 0;

            slides.forEach((_, i) => {
                const dot = document.createElement('button');
                dot.type = 'button';
                dot.className = 'carousel-dot';
                dot.setAttribute('role', 'tab');
                dot.setAttribute('aria-label', 'Go to demo ' + (i + 1));
                dot.addEventListener('click', () => goTo(i));
                dotsWrap.appendChild(dot);
            });

            const dots = Array.from(dotsWrap.children);

            function syncPlayback() {
                videos.forEach((video, i) => {
                    if (i === index) {
                        video.muted = !audioUnlocked;
                        video.play().catch(() => {});
                    } else {
                        video.pause();
                        video.muted = true;
                        try { video.currentTime = 0; } catch (_) {}
                    }
                });
            }

            function render() {
                track.style.transform = 'translateX(-' + (index * 100) + '%)';
                const slide = slides[index];
                kickerEl.textContent = slide.dataset.kicker;
                headingEl.textContent = slide.dataset.heading;
                ledeEl.textContent = slide.dataset.lede;
                linkEl.href = slide.dataset.href;
                document.title = 'Aug — ' + slide.dataset.heading;
                countEl.textContent = (index + 1) + ' / ' + slides.length;
                prevBtn.disabled = index === 0;
                nextBtn.disabled = index === slides.length - 1;
                dots.forEach((dot, i) => {
                    dot.setAttribute('aria-current', i === index ? 'true' : 'false');
                });
                syncPlayback();
            }

            function goTo(next) {
                index = Math.max(0, Math.min(slides.length - 1, next));
                render();
            }

            function unlockAudio() {
                audioUnlocked = true;
                hintEl.classList.add('is-hidden');
                const active = videos[index];
                active.muted = false;
                active.play().catch(() => {});
            }

            prevBtn.addEventListener('click', () => goTo(index - 1));
            nextBtn.addEventListener('click', () => goTo(index + 1));

            videos.forEach((video) => {
                video.addEventListener('click', unlockAudio);
            });
            hintEl.addEventListener('click', unlockAudio);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') goTo(index - 1);
                if (e.key === 'ArrowRight') goTo(index + 1);
            });

            const viewport = root.querySelector('.carousel-viewport');
            viewport.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].clientX;
            }, { passive: true });
            viewport.addEventListener('touchend', (e) => {
                const dx = e.changedTouches[0].clientX - touchStartX;
                if (Math.abs(dx) < 40) return;
                if (dx < 0) goTo(index + 1);
                else goTo(index - 1);
            }, { passive: true });

            render();
        })();
    </script>
</body>
</html>
