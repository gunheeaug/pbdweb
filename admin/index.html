<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBD Admin — Waitlist Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
            background: #F6F3F0;
            color: #1d1d1f;
            padding: 40px 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        h1 {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .admin-badge {
            background: #1d1d1f;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            background: rgba(0,0,0,0.05);
            padding: 4px;
            border-radius: 12px;
            width: fit-content;
        }
        .tab {
            padding: 8px 20px;
            border-radius: 8px;
            border: none;
            background: none;
            font-size: 15px;
            font-weight: 600;
            color: #6e6e73;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab.active {
            background: #fff;
            color: #1d1d1f;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* Table */
        .table-container {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            overflow: hidden;
            display: none;
        }
        .table-container.active {
            display: block;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th {
            background: #fafafa;
            padding: 16px 24px;
            font-size: 13px;
            font-weight: 600;
            color: #86868b;
            text-transform: uppercase;
            border-bottom: 1px solid #f2f2f2;
        }
        td {
            padding: 16px 24px;
            font-size: 15px;
            border-bottom: 1px solid #f2f2f2;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .empty-state {
            padding: 60px;
            text-align: center;
            color: #86868b;
        }
        .export-btn {
            background: #0066cc;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Waitlist Management</h1>
                <p style="color: #6e6e73; margin-top: 4px;">Manage and export user information for upcoming launches.</p>
            </div>
            <span class="admin-badge">Admin</span>
        </header>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('aug')">aug</button>
            <button class="tab" onclick="switchTab('superba')">Superba</button>
            <button class="tab" onclick="switchTab('crema')">Crèma</button>
            <button class="export-btn" style="margin-left: auto; margin-top: 0;" onclick="clearData()">Clear All Data</button>
        </div>

        <!-- aug Table -->
        <div id="aug-table" class="table-container active">
            <table>
                <thead>
                    <tr>
                        <th>Email Address</th>
                        <th>Date Added</th>
                        <th>Platform</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="aug-data">
                </tbody>
            </table>
            <div id="aug-empty" class="empty-state">
                No users on the waitlist yet.
            </div>
        </div>

        <!-- Superba Table -->
        <div id="superba-table" class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Email Address</th>
                        <th>Date Added</th>
                        <th>Platform</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="superba-data">
                </tbody>
            </table>
            <div id="superba-empty" class="empty-state">
                No users on the waitlist yet.
            </div>
        </div>

        <!-- Crèma Table -->
        <div id="crema-table" class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Email Address</th>
                        <th>Date Added</th>
                        <th>Platform</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="crema-data">
                </tbody>
            </table>
            <div id="crema-empty" class="empty-state">
                No users on the waitlist yet.
            </div>
        </div>

        <div style="margin-top: 24px; text-align: right;">
            <button class="export-btn" onclick="exportCSV()">Export Current Tab to CSV</button>
        </div>
    </div>

    <script>
        function loadData() {
            const apps = ['aug', 'superba', 'crema'];
            
            apps.forEach(app => {
                const data = JSON.parse(localStorage.getItem('pbd_waitlist_' + app) || '[]');
                const tbody = document.getElementById(app + '-data');
                const emptyState = document.getElementById(app + '-empty');
                
                tbody.innerHTML = '';
                
                if (data.length === 0) {
                    emptyState.style.display = 'block';
                    tbody.parentElement.style.display = 'none';
                } else {
                    emptyState.style.display = 'none';
                    tbody.parentElement.style.display = 'table';
                    
                    data.forEach(user => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${user.email}</td>
                            <td>${user.date}</td>
                            <td>${user.platform}</td>
                            <td><span style="color: #34c759;">Pending</span></td>
                        `;
                        tbody.appendChild(row);
                    });
                }
            });
        }

        function switchTab(appId) {
            // Update tabs
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.currentTarget.classList.add('active');

            // Update tables
            document.querySelectorAll('.table-container').forEach(c => c.classList.remove('active'));
            document.getElementById(appId + '-table').classList.add('active');
            
            window.currentApp = appId;
        }

        function clearData() {
            if (confirm('Are you sure you want to clear all waitlist data? This cannot be undone.')) {
                localStorage.removeItem('pbd_waitlist_aug');
                localStorage.removeItem('pbd_waitlist_superba');
                localStorage.removeItem('pbd_waitlist_crema');
                loadData();
            }
        }

        function exportCSV() {
            const data = JSON.parse(localStorage.getItem('pbd_waitlist_' + window.currentApp) || '[]');
            if (data.length === 0) {
                alert('No data to export.');
                return;
            }

            let csv = 'Email,Date,Platform\n';
            data.forEach(user => {
                csv += `${user.email},${user.date},${user.platform}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', `pbd_waitlist_${window.currentApp}.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        window.currentApp = 'aug';
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
