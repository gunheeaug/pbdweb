<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crèma - Post</title>

    <meta property="og:type" content="article">
    <meta property="og:site_name" content="Crèma">
    <meta property="og:title" content="Post on Crèma">
    <meta property="og:description" content="Check out this post on Crèma - Your Coffee Community">
    <meta property="og:image" content="https://jantbnwrzeyvfblschct.supabase.co/storage/v1/object/public/assets/crema-og-default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Post on Crèma">
    <meta name="twitter:description" content="Check out this post on Crèma - Your Coffee Community">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        @font-face {
            font-family: 'ArianeCoachella';
            src: url('../welcome/ac.thinitalic.otf') format('opentype');
            font-weight: normal;
            font-style: italic;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #FCF8F2;
            color: #3D2920;
            min-height: 100vh;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 20px;
            position: sticky;
            top: 0;
            background-color: #FCF8F2;
            z-index: 10;
            border-bottom: 1px solid rgba(61, 41, 32, 0.06);
        }

        .header-logo {
            font-family: 'ArianeCoachella', serif;
            font-style: italic;
            font-size: 26px;
            color: #3D2920;
        }

        .feed-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0;
        }

        .post {
            padding: 16px 20px 0;
        }

        .author-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: #3D2920;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 500;
            font-size: 16px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .author-info { flex: 1; min-width: 0; }

        .author-name-row {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .author-name {
            font-weight: 600;
            font-size: 16px;
            color: #3D2920;
        }

        .post-time {
            font-size: 13px;
            color: rgba(61, 41, 32, 0.4);
        }

        .author-headline {
            font-size: 13px;
            color: rgba(61, 41, 32, 0.55);
            margin-top: 1px;
        }

        .post-content {
            font-size: 15px;
            line-height: 1.45;
            margin-bottom: 10px;
            white-space: pre-wrap;
            word-wrap: break-word;
            padding: 0;
        }

        .media-container {
            margin: 0 -20px;
            overflow: hidden;
        }

        .media-container img,
        .media-container video {
            width: 100%;
            display: block;
        }

        .media-scroll {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .media-scroll::-webkit-scrollbar { display: none; }

        .media-scroll .media-item {
            flex: 0 0 85%;
            scroll-snap-align: start;
            margin-right: 4px;
        }

        .media-scroll .media-item:first-child {
            margin-left: 0;
        }

        .media-scroll .media-item img,
        .media-scroll .media-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .single-media img,
        .single-media video {
            width: 100%;
            display: block;
        }

        .place-card {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 12px 0;
            padding: 12px 14px;
            background: rgba(61, 41, 32, 0.04);
            border-radius: 14px;
        }

        .place-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(61, 41, 32, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .place-info { flex: 1; min-width: 0; }

        .place-name {
            font-weight: 600;
            font-size: 14px;
            color: #3D2920;
        }

        .place-address {
            font-size: 12px;
            color: rgba(61, 41, 32, 0.5);
            margin-top: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .actions-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 0;
        }

        .action-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #3D2920;
        }

        .action-icon {
            width: 22px;
            height: 22px;
        }

        .action-count {
            font-size: 14px;
            font-weight: 500;
            color: #3D2920;
        }

        .post-divider {
            height: 1px;
            background: rgba(61, 41, 32, 0.08);
            margin: 0 20px;
        }

        .cta-section {
            text-align: center;
            padding: 32px 20px 40px;
        }

        .cta-text {
            font-size: 17px;
            margin-bottom: 16px;
            color: rgba(61, 41, 32, 0.7);
        }

        .cta-button {
            display: inline-block;
            background-color: #3D2920;
            color: white;
            padding: 14px 36px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 500;
            font-size: 16px;
        }

        .cta-button:hover { background-color: #2a1d17; }

        .android-note {
            margin-top: 12px;
            font-size: 13px;
            color: rgba(61, 41, 32, 0.45);
        }

        .android-note a { color: #3D2920; }

        .loading { text-align: center; padding: 60px 20px; }

        .loading-spinner {
            width: 36px;
            height: 36px;
            border: 2.5px solid rgba(61, 41, 32, 0.1);
            border-top-color: #3D2920;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 14px;
        }

        .loading p { font-size: 14px; color: rgba(61, 41, 32, 0.5); }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error-message {
            text-align: center;
            padding: 60px 20px;
        }

        .error-message h2 {
            font-size: 18px;
            margin-bottom: 6px;
        }

        .error-message p {
            color: rgba(61, 41, 32, 0.5);
            font-size: 14px;
        }

        .heart-icon {
            fill: #C0392B;
        }
    </style>
</head>
<body>
    <div class="header">
        <span class="header-logo">Crèma</span>
    </div>

    <div class="feed-container">
        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p>Loading post...</p>
        </div>

        <div id="post-container" style="display: none;"></div>

        <div id="error" class="error-message" style="display: none;">
            <h2>Post Not Found</h2>
            <p>This post may have been deleted or is no longer available.</p>
        </div>

        <div class="cta-section">
            <p class="cta-text">See more on Crèma</p>
            <a href="https://apps.apple.com/app/crema" class="cta-button" id="download-btn">Download the App</a>
            <p class="android-note">Android? <a href="https://pbd.team/crema/waitlist">Join the waitlist</a></p>
        </div>
    </div>

    <script>
        var SUPABASE_URL = 'https://jantbnwrzeyvfblschct.supabase.co';
        var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImphbnRibndyemV5dmZibHNjaGN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkxOTk3OTEsImV4cCI6MjA4NDc3NTc5MX0.qGMiXRyBusIdmf-CSx8ohVWLFXFi7tVYY91rzmsMfrI';

        function getPostIdFromPath() {
            var parts = window.location.pathname.split('/').filter(Boolean);
            var postId = parts[parts.length - 1];
            var re = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
            return re.test(postId) ? postId : null;
        }

        function escapeHtml(text) {
            var d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        function isVideoUrl(url) {
            return /\.(mp4|mov|m4v|webm)$/i.test(url);
        }

        function timeAgo(dateStr) {
            var now = new Date();
            var then = new Date(dateStr);
            var secs = Math.floor((now - then) / 1000);
            if (secs < 60) return 'now';
            var mins = Math.floor(secs / 60);
            if (mins < 60) return mins + 'm';
            var hrs = Math.floor(mins / 60);
            if (hrs < 24) return hrs + 'h';
            var days = Math.floor(hrs / 24);
            if (days < 30) return days + 'd';
            var months = Math.floor(days / 30);
            if (months < 12) return months + 'mo';
            return Math.floor(months / 12) + 'y';
        }

        function getInitials(first, last) {
            return (((first || '')[0] || '') + ((last || '')[0] || '')).toUpperCase() || '?';
        }

        async function loadPost() {
            var postId = getPostIdFromPath();
            if (!postId) { showError(); return; }

            var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            if (isIOS) {
                window.location.href = 'crema://post/' + postId;
            }

            try {
                var resp = await fetch(
                    SUPABASE_URL + '/rest/v1/posts?id=eq.' + postId + '&select=id,content,media_urls,location,likes_count,comments_count,created_at,profiles!posts_user_id_fkey(first_name,last_name,headline,profile_image_url)',
                    { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY } }
                );
                if (!resp.ok) throw new Error('Failed');
                var posts = await resp.json();
                if (!posts || posts.length === 0) { showError(); return; }
                renderPost(posts[0]);
            } catch (e) {
                console.error(e);
                showError();
            }
        }

        function renderPost(post) {
            var p = post.profiles || {};
            var name = ((p.first_name || '') + ' ' + (p.last_name || '')).trim() || 'Someone';
            var headline = p.headline || 'Coffee Enthusiast';
            var initials = getInitials(p.first_name, p.last_name);
            var time = timeAgo(post.created_at);

            var avatarHtml = p.profile_image_url
                ? '<img src="' + escapeHtml(p.profile_image_url) + '" alt="">'
                : escapeHtml(initials);

            var mediaHtml = '';
            if (post.media_urls && post.media_urls.length > 0) {
                if (post.media_urls.length === 1) {
                    var m = post.media_urls[0];
                    mediaHtml = '<div class="media-container single-media">' +
                        (isVideoUrl(m)
                            ? '<video controls playsinline><source src="' + escapeHtml(m) + '" type="video/mp4"></video>'
                            : '<img src="' + escapeHtml(m) + '" alt="">') +
                        '</div>';
                } else {
                    mediaHtml = '<div class="media-container"><div class="media-scroll">';
                    post.media_urls.forEach(function(m) {
                        mediaHtml += '<div class="media-item">' +
                            (isVideoUrl(m)
                                ? '<video controls playsinline><source src="' + escapeHtml(m) + '" type="video/mp4"></video>'
                                : '<img src="' + escapeHtml(m) + '" alt="">') +
                            '</div>';
                    });
                    mediaHtml += '</div></div>';
                }
            }

            var placeHtml = '';
            if (post.location) {
                placeHtml = '<div class="place-card">' +
                    '<div class="place-icon">☕</div>' +
                    '<div class="place-info">' +
                    '<div class="place-name">' + escapeHtml(post.location) + '</div>' +
                    '</div></div>';
            }

            var likesCount = post.likes_count || 0;
            var commentsCount = post.comments_count || 0;

            var heartSvg = '<svg class="action-icon heart-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
            var commentSvg = '<svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="#3D2920" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>';

            var html = '<div class="post">' +
                '<div class="author-row">' +
                '<div class="avatar">' + avatarHtml + '</div>' +
                '<div class="author-info">' +
                '<div class="author-name-row">' +
                '<span class="author-name">' + escapeHtml(name) + '</span>' +
                '<span class="post-time">' + escapeHtml(time) + '</span>' +
                '</div>' +
                '<div class="author-headline">' + escapeHtml(headline) + '</div>' +
                '</div></div>' +
                '<div class="post-content">' + escapeHtml(post.content) + '</div>' +
                mediaHtml +
                placeHtml +
                '<div class="actions-row">' +
                '<div class="action-item">' + heartSvg + (likesCount > 0 ? '<span class="action-count">' + likesCount + '</span>' : '') + '</div>' +
                '<div class="action-item">' + commentSvg + (commentsCount > 0 ? '<span class="action-count">' + commentsCount + '</span>' : '') + '</div>' +
                '</div></div>' +
                '<div class="post-divider"></div>';

            document.getElementById('loading').style.display = 'none';
            document.getElementById('post-container').innerHTML = html;
            document.getElementById('post-container').style.display = 'block';
            document.title = name + ' on Crèma';
        }

        function showError() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
        }

        document.addEventListener('DOMContentLoaded', loadPost);
    </script>
</body>
</html>
