<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the Android Waitlist — Crèma | PBD</title>
    <link rel="icon" type="image/png" href="/assets/images/CremaAppIconRounded.png">
    <link rel="apple-touch-icon" href="/assets/images/CremaAppIconRounded.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
            background: #F6F3F0;
            color: #1d1d1f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #fff;
            padding: 40px 24px;
            border-radius: 32px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .app-icon {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }
        p {
            font-size: 17px;
            color: #6e6e73;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        input[type="email"] {
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #d2d2d7;
            font-size: 17px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="email"]:focus {
            border-color: #0066cc;
        }
        button {
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: #1d1d1f;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .back-link {
            margin-top: 24px;
            display: inline-block;
            color: #0066cc;
            text-decoration: none;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/assets/images/CremaAppIconRounded.png" alt="Crèma" class="app-icon">
        <h1>Crèma for Android</h1>
        <p>Join the waitlist to get notified when Crèma launches on Android.</p>
        
        <form action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST">
            <input type="email" name="email" placeholder="Enter your email" required>
            <input type="hidden" name="app" value="crema">
            <button type="submit">Notify Me</button>
        </form>
        
        <a href="/crema/" class="back-link">← Back to Crèma</a>
    </div>
</body>
</html>
