<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the Android Waitlist — Crèma | PBD</title>
    <link rel="icon" type="image/png" href="/assets/images/CremaAppIconRounded.png">
    <link rel="apple-touch-icon" href="/assets/images/CremaAppIconRounded.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'ArianeCoachella';
            src: url('/crema/assets/ac-thinitalic.otf') format('opentype');
            font-weight: 300;
            font-style: italic;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
            background: #F6F3F0;
            color: #1d1d1f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #fff;
            padding: 40px 24px;
            border-radius: 32px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .app-icon {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            margin-bottom: 24px;
        }
        h1 {
            font-family: 'ArianeCoachella', Georgia, serif;
            font-size: 40px;
            font-weight: 300;
            font-style: italic;
            margin-bottom: 12px;
            letter-spacing: 0;
        }
        p {
            font-size: 17px;
            color: #6e6e73;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        input[type="email"],
        input[type="tel"] {
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #d2d2d7;
            font-size: 17px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="email"]:focus,
        input[type="tel"]:focus {
            border-color: #0066cc;
        }
        button {
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: #1d1d1f;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .back-link {
            margin-top: 24px;
            display: inline-block;
            color: #0066cc;
            text-decoration: none;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <picture style="display: contents;"><source srcset="/assets/images/CremaAppIconRounded.webp" type="image/webp"><img src="/assets/images/CremaAppIconRounded.png" alt="Crèma" class="app-icon" decoding="async"></picture>
        <h1>Crèma for Android</h1>
        <p>Join the waitlist to get notified when Crèma launches on Android.</p>
        
        <form id="waitlistForm">
            <input type="email" id="emailInput" placeholder="Enter your email" required>
            <input type="tel" id="phoneInput" placeholder="Phone number" required>
            <label style="display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:14px;color:#6e6e73;line-height:1.4;">
                <input type="checkbox" id="smsConsent" required style="margin-top:3px;flex-shrink:0;">
                <span>I agree to receive SMS messages of any kind from Crèma (access codes, product updates, and other notices). Msg &amp; data rates may apply.</span>
            </label>
            <button type="submit">Notify Me</button>
        </form>
        
        <div id="successMessage" style="display: none; margin-top: 20px; color: #34c759; font-weight: 600;">
            You've been added to the waitlist! Watch for a text with your access code in about a day.
        </div>
        <div id="errorMessage" style="display: none; margin-top: 20px; color: #ff3b30; font-weight: 600;">
            Something went wrong. Please try again.
        </div>
        
        <a href="/crema/" class="back-link">← Back to Crèma</a>
    </div>

    <script>
        const SUPABASE_URL = 'https://jantbnwrzeyvfblschct.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImphbnRibndyemV5dmZibHNjaGN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkxOTk3OTEsImV4cCI6MjA4NDc3NTc5MX0.qGMiXRyBusIdmf-CSx8ohVWLFXFi7tVYY91rzmsMfrI';

        // Check for phone number from onboarding
        const onboardingPhone = localStorage.getItem('pbd_onboarding_phone');
        if (onboardingPhone) {
            document.getElementById('phoneInput').value = onboardingPhone;
        }

        document.getElementById('waitlistForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitButton = e.target.querySelector('button[type="submit"]');
            const email = document.getElementById('emailInput').value.trim();
            const phone = document.getElementById('phoneInput').value.trim();
            const smsConsent = document.getElementById('smsConsent').checked;
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.style.display = 'none';
            errorMessage.textContent = 'Something went wrong. Please try again.';
            submitButton.disabled = true;

            if (!phone || !smsConsent) {
                errorMessage.textContent = 'Phone number and SMS consent are required.';
                errorMessage.style.display = 'block';
                submitButton.disabled = false;
                return;
            }

            try {
                const checkRes = await fetch(`${SUPABASE_URL}/rest/v1/rpc/waitlist_has_open_code`, {
                    method: 'POST',
                    headers: {
                        apikey: SUPABASE_ANON_KEY,
                        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ p_phone: phone })
                });
                const hasOpen = await checkRes.json();
                if (hasOpen === true) {
                    errorMessage.textContent = "You're already on the waitlist with an access code.";
                    errorMessage.style.display = 'block';
                    submitButton.disabled = false;
                    return;
                }

                const response = await fetch(`${SUPABASE_URL}/rest/v1/waitlist_submissions`, {
                    method: 'POST',
                    headers: {
                        apikey: SUPABASE_ANON_KEY,
                        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json',
                        Prefer: 'return=minimal'
                    },
                    body: JSON.stringify({
                        email,
                        phone,
                        platform: 'Android',
                        source: 'crema-android-waitlist',
                        sms_consent: true,
                        sms_consent_at: new Date().toISOString()
                    })
                });

                if (!response.ok) throw new Error('Waitlist submission failed');

                document.getElementById('waitlistForm').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';
            } catch (error) {
                console.error(error);
                errorMessage.style.display = 'block';
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
