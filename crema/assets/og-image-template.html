<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        @font-face {
            font-family: 'ArianeCoachella';
            src: url('ac-thinitalic.otf') format('opentype');
            font-weight: 300;
            font-style: italic;
        }
        
        body {
            width: 1200px;
            height: 630px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fcf8f2 0%, #f5ede2 100%);
        }
        
        .logo {
            font-family: 'ArianeCoachella', Georgia, serif;
            font-size: 140px;
            font-weight: 300;
            font-style: italic;
            color: #3d2920;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="logo">Crèma</div>
</body>
</html>
