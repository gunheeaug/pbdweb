<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Join Crema</title>
    
    <!-- Open Graph / Social Media Preview -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Join Crema">
    <meta property="og:description" content="You've been invited to join Crema - connect with coffee lovers">
    <meta property="og:image" content="https://pbd.team/crema/assets/Crema%20thumbnail.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://pbd.team/crema/welcome">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Join Crema">
    <meta name="twitter:description" content="You've been invited to join Crema - connect with coffee lovers">
    <meta name="twitter:image" content="https://pbd.team/crema/assets/Crema%20thumbnail.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Step 1: Phone Entry -->
        <div id="phone-step" class="step active">
            <h1 class="logo">Crèma</h1>
            <h2 class="title">What's your<br>phone number?</h2>
            
            <div class="phone-input-row">
                <button class="country-picker" id="country-picker">
                    <span id="dial-code">+1</span>
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                        <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </button>
                <div class="divider"></div>
                <input type="tel" id="phone-input" placeholder="000-000-0000" maxlength="12">
            </div>
            
            <p class="error-message" id="phone-error"></p>
            
            <button class="btn btn-primary" id="request-code-btn" disabled>Request Code</button>
        </div>
        
        <!-- Step 2: OTP Verification -->
        <div id="otp-step" class="step">
            <h2 class="title">Enter the code</h2>
            
            <input type="tel" id="otp-input" class="otp-input" placeholder="000000" maxlength="6">
            
            <p class="resend-text" id="resend-text">Resend to <span id="phone-display"></span> in <span id="countdown">60</span>s</p>
            <button class="resend-btn" id="resend-btn" style="display: none;">Resend code</button>
            
            <p class="error-message" id="otp-error"></p>
            
            <button class="btn btn-primary" id="verify-code-btn" disabled>Verify Code</button>
        </div>
        
        <!-- Step 3: Name Entry (for new users) -->
        <div id="name-step" class="step">
            <h2 class="title">What's your name?</h2>
            
            <div class="name-inputs">
                <input type="text" id="first-name-input" placeholder="First name" class="name-input">
                <input type="text" id="last-name-input" placeholder="Last name" class="name-input">
            </div>
            
            <p class="error-message" id="name-error"></p>
            
            <button class="btn btn-primary" id="continue-name-btn" disabled>Continue</button>
        </div>
        
        <!-- Step 4: Success -->
        <div id="success-step" class="step">
            <h2 class="welcome-title">Welcome,</h2>
            <h1 class="user-name" id="user-name">Friend</h1>
            
            <div class="coffee-bean">☕</div>
            
            <p class="success-message">You're all set! Download the app to start exploring.</p>
            
            <div class="app-buttons">
                <a href="https://apps.apple.com/app/crema" class="btn btn-primary" target="_blank">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
                    </svg>
                    Download on App Store
                </a>
                <button class="btn btn-secondary" id="android-waitlist-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17.6 9.48l1.84-3.18c.16-.31.04-.69-.26-.85-.29-.15-.65-.06-.83.22l-1.88 3.24c-2.86-1.21-6.08-1.21-8.94 0L5.65 5.67c-.19-.29-.58-.38-.87-.2-.28.18-.37.54-.22.83L6.4 9.48C3.3 11.25 1.28 14.44 1 18h22c-.28-3.56-2.3-6.75-5.4-8.52zM7 15.25c-.69 0-1.25-.56-1.25-1.25s.56-1.25 1.25-1.25 1.25.56 1.25 1.25-.56 1.25-1.25 1.25zm10 0c-.69 0-1.25-.56-1.25-1.25s.56-1.25 1.25-1.25 1.25.56 1.25 1.25-.56 1.25-1.25 1.25z"/>
                    </svg>
                    Join Android Waitlist
                </button>
            </div>
        </div>
        
        <!-- Country Picker Modal -->
        <div id="country-modal" class="modal">
            <div class="modal-content">
                <div class="country-list" id="country-list"></div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
