<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function() {
            var path = window.location.pathname;
            // Route /crema/post/{uuid} to the post page
            if (/^\/crema\/post\/[0-9a-f\-]+$/i.test(path)) {
                // Store the full path and reload the post index which will read the UUID from the URL
                var script = document.createElement('script');
                script.textContent = 'sessionStorage.setItem("postRedirect","' + path + '");';
                document.head.appendChild(script);
                // GitHub Pages serves 404.html but keeps the URL - the post page JS reads the UUID from window.location
                // So we just need to serve the same content as the post page
                return;
            }
            // Route /crema/profile/{uuid} to the profile page
            if (/^\/crema\/profile\/[0-9a-f\-]+$/i.test(path)) {
                return;
            }
            // For everything else, show a real 404
            document.addEventListener('DOMContentLoaded', function() {
                document.getElementById('real-404').style.display = 'flex';
            });
        })();
    </script>
    <title>Crèma</title>
    <meta property="og:site_name" content="Crèma">
    <meta property="og:title" content="Crèma - Your Coffee Community">
    <meta property="og:description" content="Check out this post on Crèma - Your Coffee Community">
    <meta property="og:image" content="https://jantbnwrzeyvfblschct.supabase.co/storage/v1/object/public/assets/crema-og-default.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #FCF8F2;
            color: #3D2920;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        .logo {
            font-size: 28px;
            font-style: italic;
            color: #3D2920;
            text-align: center;
            margin-bottom: 32px;
        }
        .loading { text-align: center; padding: 40px 0; }
        .loading-spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(61,41,32,0.1);
            border-top-color: #3D2920;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .post-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .author-section { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .author-avatar {
            width: 48px; height: 48px; border-radius: 50%; background-color: #3D2920;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 500; font-size: 18px; overflow: hidden; flex-shrink: 0;
        }
        .author-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .author-info { flex: 1; min-width: 0; }
        .author-name { font-weight: 600; font-size: 17px; color: #3D2920; }
        .author-headline { font-size: 14px; color: rgba(61,41,32,0.65); }
        .post-content { font-size: 16px; line-height: 1.5; margin-bottom: 16px; white-space: pre-wrap; word-wrap: break-word; }
        .post-media { border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
        .post-media img, .post-media video { width: 100%; display: block; }
        .error-message { text-align: center; padding: 40px 20px; }
        .error-message h2 { font-size: 20px; margin-bottom: 8px; }
        .error-message p { color: rgba(61,41,32,0.65); }
        .cta-section { margin-top: auto; padding-top: 32px; text-align: center; }
        .cta-text { font-size: 18px; margin-bottom: 16px; }
        .cta-button {
            display: inline-block; background-color: #3D2920; color: white;
            padding: 14px 32px; border-radius: 30px; text-decoration: none; font-weight: 500; font-size: 16px;
        }
        .cta-button:hover { background-color: #2a1d17; }
        .android-note { margin-top: 12px; font-size: 14px; color: rgba(61,41,32,0.65); }
        .android-note a { color: #3D2920; }
        #real-404 { display: none; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
    </style>
</head>
<body>
    <div id="real-404">
        <div>
            <div class="logo">Crèma</div>
            <h2 style="margin-bottom:8px;">Page Not Found</h2>
            <p style="color:rgba(61,41,32,0.65);">The page you're looking for doesn't exist.</p>
            <p style="margin-top:20px;"><a href="/crema/" style="color:#3D2920;">Go to Crèma</a></p>
        </div>
    </div>

    <div id="post-app" style="display:none;">
        <div class="container">
            <div class="logo">Crèma</div>
            <div id="loading" class="loading">
                <div class="loading-spinner"></div>
                <p>Loading post...</p>
            </div>
            <div id="post-container" style="display:none;"></div>
            <div id="error" class="error-message" style="display:none;">
                <h2>Post Not Found</h2>
                <p>This post may have been deleted or is no longer available.</p>
            </div>
            <div class="cta-section">
                <p class="cta-text">See more on Crèma</p>
                <a href="https://apps.apple.com/app/crema" class="cta-button">Download the App</a>
                <p class="android-note">Android? <a href="https://pbd.team/crema/waitlist">Join the waitlist</a></p>
            </div>
        </div>
    </div>

    <script>
        var path = window.location.pathname;
        var isPostPage = /^\/crema\/post\/[0-9a-f\-]+$/i.test(path);

        if (isPostPage) {
            document.getElementById('post-app').style.display = 'block';

            var SUPABASE_URL = 'https://jantbnwrzeyvfblschct.supabase.co';
            var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImphbnRibndyemV5dmZibHNjaGN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkxOTk3OTEsImV4cCI6MjA4NDc3NTc5MX0.qGMiXRyBusIdmf-CSx8ohVWLFXFi7tVYY91rzmsMfrI';

            function getPostIdFromPath() {
                var parts = window.location.pathname.split('/').filter(Boolean);
                var postId = parts[parts.length - 1];
                var re = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
                return re.test(postId) ? postId : null;
            }

            function escapeHtml(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
            function isVideoUrl(u) { return /\.(mp4|mov|m4v|webm)$/i.test(u); }

            var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            var postId = getPostIdFromPath();
            if (isIOS && postId) { window.location.href = 'crema://post/' + postId; }

            fetch(
                SUPABASE_URL + '/rest/v1/posts?id=eq.' + postId + '&select=id,content,media_urls,user_id,created_at,profiles!posts_user_id_fkey(first_name,last_name,headline,profile_image_url)',
                { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY } }
            ).then(function(r) { return r.json(); }).then(function(posts) {
                if (!posts || posts.length === 0) { showErr(); return; }
                var post = posts[0];
                var p = post.profiles || {};
                var name = ((p.first_name||'') + ' ' + (p.last_name||'')).trim() || 'Someone';
                var hl = p.headline || 'Coffee Enthusiast';
                var initials = ((p.first_name||'')[0]||'') + ((p.last_name||'')[0]||'');
                var av = p.profile_image_url ? '<img src="'+escapeHtml(p.profile_image_url)+'">' : initials.toUpperCase();
                var media = '';
                if (post.media_urls && post.media_urls.length > 0) {
                    var m = post.media_urls[0];
                    media = isVideoUrl(m)
                        ? '<div class="post-media"><video controls playsinline><source src="'+escapeHtml(m)+'" type="video/mp4"></video></div>'
                        : '<div class="post-media"><img src="'+escapeHtml(m)+'" alt="Post"></div>';
                }
                document.getElementById('loading').style.display = 'none';
                document.getElementById('post-container').innerHTML =
                    '<div class="post-card"><div class="author-section"><div class="author-avatar">'+av+'</div><div class="author-info"><div class="author-name">'+escapeHtml(name)+'</div><div class="author-headline">'+escapeHtml(hl)+'</div></div></div><div class="post-content">'+escapeHtml(post.content)+'</div>'+media+'</div>';
                document.getElementById('post-container').style.display = 'block';
                document.title = name + ' on Crèma';
            }).catch(function() { showErr(); });

            function showErr() {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
            }
        }
    </script>
</body>
</html>
